spring.application.name=spring-pipeline
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
logging.level.root=INFO
logging.level.com.example.springpipeline=INFO
logging.file.name=./logs/spring-pipeline.log
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#SPRING_DATASOURCE_URL=jdbc:postgresql://postgresdb.cp484oko83ef.us-east-2.rds.amazonaws.com:5432/postgres
#spring.datasource.url=${SPRING_DATASOURCE_URL}
#spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:changeit}
spring.datasource.driver-class-name=org.postgresql.Driver
security.jwt.secret=${SECURITY_JWT_SECRET:replace-this-secret-with-a-long-random-value-32+}
security.jwt.expiration-seconds=${SECURITY_JWT_EXPIRATION_SECONDS:3600}
security.auth.username=${SECURITY_AUTH_USERNAME:admin}
security.auth.password=${SECURITY_AUTH_PASSWORD:changeit}
