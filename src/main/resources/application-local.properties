spring.application.name=spring-pipeline
server.port=${PORT:8081}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
logging.level.root=INFO
logging.level.com.example.springpipeline=INFO
logging.file.name=./logs/spring-pipeline.log
spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
SPRING_DATASOURCE_URL=jdbc:postgresql://postgresdb.cp484oko83ef.us-east-2.rds.amazonaws.com:5432/postgres
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=password

