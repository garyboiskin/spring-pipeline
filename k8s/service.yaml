apiVersion: v1
kind: Service
metadata:
  name: spring-pipeline
  labels:
    app: spring-pipeline
  #annotations:
     # EKS Auto Mode creates an internal NLB by default; make it public.
     # service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
     # service.beta.kubernetes.io/aws-load-balancer-nlb-target-type: ip
spec:
  type: LoadBalancer
  #loadBalancerClass: eks.amazonaws.com/nlb
  selector:
    app: spring-pipeline
  ports:
    - name: http
      port: 80
      targetPort: 8080

