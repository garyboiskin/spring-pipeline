apiVersion: apps/v1
kind: Deployment
metadata:
  name: spring-pipeline
  labels:
    app: spring-pipeline
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spring-pipeline
  template:
    metadata:
      labels:
        app: spring-pipeline
    spec:
      containers:
        - name: spring-pipeline
          image: 839670623406.dkr.ecr.us-east-2.amazonaws.com/springboot-eks:latest
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgresdb.cp484oko83ef.us-east-2.rds.amazonaws.com:5432/<db-name>
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: SPRING_DATASOURCE_USERNAME
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: db-secret
                  key: SPRING_DATASOURCE_PASSWORD
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

